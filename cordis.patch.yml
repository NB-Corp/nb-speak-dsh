- insert:
    - id: nb-speak
      name: '@nb-corp/nb-speak-dsh'
      config:
        runtimeMode: native
        preset: neutral_peer
        clarity: 1.0
        warmth: 0.2
        sharp_wit: 0.1
        calm_grounding: 0.2
        concise_cadence: 0.3
        registerGlobalTools: true
        cloudBaseUrl: https://api.deepseek.com/v1
        defaultCloudModel: deepseek-chat
        voiceModelBaseUrl: http://127.0.0.1:18088/v1
        defaultVoiceModel: nb-speak-voice-v1
        bridgeEnabled: false
        bridgeHost: 127.0.0.1
        bridgePort: 18091
        bubbleJoinMode: paragraph
